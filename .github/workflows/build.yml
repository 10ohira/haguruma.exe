name: Build Windows EXE
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    if: |
      startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '[release]') ||
      github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            v="${tag#v}"
          else
            v=$(node -p "require('./package.json').version")
            tag="v$v"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$v tag=$tag"

      - name: Delete previous release and tag (rebuild mode)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Typescript
        run: npm run build

      - name: Set EXE Icon
        shell: powershell
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $package.build.win.icon = "./public/favicon.ico"
          $package | ConvertTo-Json -Depth 100 | Set-Content package.json

      - name: Build Windows EXE
        run: npm run dist

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: |
            build/*.exe
          target_commitish: ${{ github.sha }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
