<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="./output.css">
    <style>
        html, body {
            background: transparent;
            /* The overlay canvas must cover the window exactly: any body margin
               or inline-canvas whitespace shifts the canvas origin, so the
               canvas centre (used for the aim circle) and projected ESP boxes
               end up a few px off the real screen centre. */
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <canvas id="canvas" style="outline:1.2px solid #c45a2c; outline-offset:-1px;"></canvas>
    <script type="module" src="../dist/layout.js"></script>
</body>
</html>
